const BOT_CHIPS={
  patient:[{id:'login',en:"How do I sign in?",hi:"साइन इन कैसे करें?"},{id:'voice',en:"Use voice",hi:"आवाज़ से जवाब दें"},{id:'ocr',en:"Upload reports",hi:"रिपोर्ट अपलोड"},{id:'privacy',en:"Is my data safe?",hi:"क्या डेटा सुरक्षित है?"},{id:'hospitals',en:"Nearby hospitals",hi:"नज़दीकी अस्पताल"}],
  doctor:[{id:'doctor',en:"Doctor view",hi:"डॉक्टर व्यू"},{id:'token',en:"Triage & token",hi:"ट्राइएज और टोकन"},{id:'language',en:"Change language",hi:"भाषा बदलें"},{id:'voice',en:"Use voice",hi:"आवाज़ से जवाब दें"}],
  admin:[{id:'admin',en:"Admin dashboard",hi:"एडमिन डैशबोर्ड"},{id:'doctor',en:"Doctor view",hi:"डॉक्टर व्यू"},{id:'language',en:"Change language",hi:"भाषा बदलें"},{id:'privacy',en:"Privacy & consent",hi:"प्राइवेसी और सहमति"}]
};

const botNorm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/\u093c/g,'');
const BOT_SPLIT=new RegExp('[^\\p{L}\\p{M}\\p{N}]+','u');
const BOT_STRIP=new RegExp('[•\\u{1F300}-\\u{1FAFF}\\u2600-\\u27BF]','gu');
function botMatch(q){
  const text=botNorm(q),toks=new Set(text.split(BOT_SPLIT).filter(Boolean));
  let best=null,bestScore=0;
  for(const e of BOT_KB){
    let sc=0;
    for(const k of e.k){
      const kk=botNorm(k);
      if(kk.length<=3?toks.has(kk):text.includes(kk))sc+=Math.max(kk.length,5);
    }
    if(e.pri)sc*=3;
    if(sc>bestScore){best=e;bestScore=sc;}
  }
  return best?best.id:null;
}
function botText(ref,lang){
  const ui=BOT_UI[lang]||BOT_UI.en;
  const local=BOT_LOCALE[lang];
  if(local){
    if(ref==='hello'||ref==='greet')return local.hello;
    if(ref==='emergency')return local.emergency;
    /* Each offline rule returns a safe, in-language answer instead of falling
       through to English while a user is speaking their selected language. */
    return local.fallback;
  }
  if(ref==='hello')return ui.hello;
  if(ref==='fallback')return ui.fallback;
  const e=BOT_KB.find(x=>x.id===ref);
  return e?(e[lang]||e.en):ui.fallback;
}

function ChatBot({lang,audioOn,role}){
  const ui=BOT_UI[lang]||BOT_UI.en;
  const [open,setOpen]=useState(false);
  const [msgs,setMsgs]=useState([{id:0,from:'bot',ref:'hello'}]);
  const [inp,setInp]=useState('');
  const [typing,setTyping]=useState(false);
  const [rec,setRec]=useState(false);
  const [hint,setHint]=useState('');
  const bodyRef=useRef(null),inRef=useRef(null),timer=useRef(null),seq=useRef(1);
  const {supported,start,stop}=useMic(lang);
  const speak=useSpeak(lang,audioOn);

  useEffect(()=>{
    if(open&&bodyRef.current)bodyRef.current.scrollTop=bodyRef.current.scrollHeight;
  },[msgs,typing,open]);
  useEffect(()=>{if(open)setTimeout(()=>inRef.current?.focus(),60);},[open]);
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  useEffect(()=>{setHint('');},[lang]);

  function push(m){setMsgs(p=>[...p,{id:seq.current++,...m}]);}
  function send(text,forcedId){
    const q=(text||'').trim();
    if(!q||typing)return;
    push({from:'me',text:q});
    setInp('');setHint('');setTyping(true);
    timer.current=setTimeout(()=>{
      const id=forcedId||botMatch(q)||'fallback';
      push({from:'bot',ref:id});
      setTyping(false);
      if(id==='emergency'&&audioOn)Speech.speak(botText(id,lang).replace(BOT_STRIP,''),lang);
    },550);
  }
  function toggleMic(){
    if(rec){stop();setRec(false);return;}
    if(!supported){setHint(ui.noMic);return;}
    setHint('');Speech.stop();
    const ok=start(txt=>{if(txt)send(txt);},err=>{
      setRec(false);
      if(err&&err!=='no-speech'&&err!=='aborted')setHint(ui.micErr);
    });
    if(ok)setRec(true);
  }
  function closeChat(){stop();setRec(false);Speech.stop();setOpen(false);}

  return(
    <>
      {open&&(
        <div className="cb-panel" role="dialog" aria-label={ui.title}
             onKeyDown={e=>{if(e.key==='Escape')closeChat();}}>
          <div className="cb-hdr">
            <div className="logo-ic">💬</div>
            <div style={{flex:1,minWidth:0}}>
              <div className="cb-t">{ui.title}</div>
              <div className="cb-s"><span className="cb-on"/>{ui.sub}</div>
            </div>
            <button type="button" className="cb-x" onClick={closeChat} aria-label={ui.close}>✕</button>
          </div>

          <div className="cb-body" ref={bodyRef}>
            {msgs.map(m=>{
              const txt=m.from==='me'?m.text:botText(m.ref,lang);
              return(
                <div key={m.id} className={`cb-msg ${m.from}`}>
                  <div className={`cb-b ${m.from}`}>{txt}</div>
                  {m.from==='bot'&&(
                    <button type="button" className="icon-btn cb-act" title={ui.speakIt} aria-label={ui.speakIt}
                            onClick={()=>speak(txt.replace(BOT_STRIP,''),true)}>🔊</button>
                  )}
                </div>
              );
            })}
            {typing&&<div className="cb-msg bot"><div className="cb-b bot cb-typing"><i/><i/><i/></div></div>}
          </div>

          <div className="cb-chips">
            {(BOT_CHIPS[role]||BOT_CHIPS.patient).map(c=>(
              <button key={c.id} type="button" className="cb-chip" onClick={()=>send(c[lang]||c.en,c.id)}>{c[lang]||c.en}</button>
            ))}
          </div>
          {hint&&<div className="cb-hint">{hint}</div>}

          <div className="cb-in">
            <div className="vf-wrap" style={{flex:1}}>
              <input ref={inRef} className={`vf-in ${rec?'rec':''}`} value={inp} maxLength={300}
                     placeholder={rec?ui.phListen:ui.ph} aria-label={ui.ph}
                     onChange={e=>setInp(e.target.value)}
                     onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();send(inp);}}}/>
              <button type="button" className={`vf-mic vf-mic-mid ${rec?'rec':''}`} title={ui.mic} aria-label={ui.mic}
                      onClick={e=>{e.stopPropagation();toggleMic();}}>🎤</button>
            </div>
            <button type="button" className="btn btn-p btn-sm" disabled={!inp.trim()||typing} onClick={()=>send(inp)}>{ui.send}</button>
          </div>
        </div>
      )}
      <button type="button" className="cb-fab" onClick={()=>open?closeChat():setOpen(true)} aria-expanded={open}>
        <span>{open?'✕':'💬'}</span><span>{open?ui.close:ui.fab}</span>
      </button>
    </>
  );
}

/* ══════ ROOT ══════ */
function App(){
  const [role,setRole]=useState('patient');
  const [lang,setLang]=useState('en');
  const [easy,setEasy]=useState(false);
  const appRef=useRef(null);
  const [audioOn,setAudioOn]=useState(true);
  const [toast,setToast]=useState(null);
  const [queue,setQueue]=useState(SEED_PATIENTS);
  const t=useT(lang);
  usePageLanguage(lang,appRef);

  // Unlock speech synthesis on first user gesture (required by Chrome/Safari)
  useEffect(()=>{
    const unlock=()=>{
      try{
        const u=new SpeechSynthesisUtterance('');u.volume=0;
        window.speechSynthesis?.speak(u);
      }catch(e){}
      Speech.init();
      window.removeEventListener('pointerdown',unlock);
      window.removeEventListener('keydown',unlock);
    };
    window.addEventListener('pointerdown',unlock,{once:true});
    window.addEventListener('keydown',unlock,{once:true});
    return()=>{window.removeEventListener('pointerdown',unlock);window.removeEventListener('keydown',unlock);};
  },[]);

  const showToast=useCallback((msg,type='info')=>setToast({msg,type,id:Date.now()}),[]);
  const addToQueue=useCallback(p=>{
    setQueue(q=>[{...p,fresh:true},...q]);
  },[]);
  const markSeen=useCallback(id=>{
    setQueue(q=>q.map(p=>p.id===id?{...p,fresh:false}:p));
  },[]);

  function changeLang(l){
    setLang(l);
    Speech.stop();
    if(audioOn)setTimeout(()=>Speech.speak(`${languageMeta(l).label} language selected`,l),120);
  }
  function toggleAudio(){
    const n=!audioOn;setAudioOn(n);
    if(!n)Speech.stop();
    else Speech.speak(t('audioOn'),lang);
  }
  const freshCount=queue.filter(p=>p.fresh).length;

  return(
    <div ref={appRef} className={role==='patient'&&easy?'senior-ui':''}>
      <header className="hdr">
        <div className="logo">
          <div className="logo-ic">⚕</div>
          <div>
            <div className="logo-tx">Medi<em>Node</em><span style={{fontSize:10,fontWeight:500,color:'rgba(255,255,255,.4)',marginLeft:5}}>v4</span></div>
            <div className="logo-sb">{t('sub')}</div>
          </div>
        </div>
        <div className="rsw">
          {[['patient',t('pt'),'🧑'],['doctor',t('doc'),'👨‍⚕️'],['admin',t('adm'),'📊']].map(([r,lb,ic])=>(
            <button key={r} type="button" className={`rbtn ${role===r?'on':''}`} onClick={()=>{setRole(r);Speech.stop();}}>
              {ic} {lb}
              {r==='doctor'&&freshCount>0&&role!=='doctor'&&<span className="qdot">{freshCount}</span>}
            </button>
          ))}
        </div>
        <div className="hdr-r">
          <select className="lpill" value={lang} onChange={e=>changeLang(e.target.value)} aria-label="Select language">
            {LANGUAGES.map(({id,short,label})=><option key={id} value={id}>{short} · {label}</option>)}
          </select>
          <button type="button" className={`apill ${!audioOn?'muted':''}`} onClick={toggleAudio}>
            {audioOn?'🔊':'🔇'} {audioOn?t('audioOn'):t('audioOff')}
          </button>
          {role==='patient'&&<button type="button" className={`apill ${easy?'':'muted'}`} onClick={()=>setEasy(v=>!v)} title="Easy mode for elderly users">
            🧓 {easy?'Easy':'Easy mode'}
          </button>}
          <span className="abha-chip">ABDM ✓</span>
        </div>
      </header>
      <main className="main">
        {role==='patient'&&<PatientMode lang={lang} audioOn={audioOn} showToast={showToast} addToQueue={addToQueue} easy={easy} onEasyChange={setEasy} onToggleAudio={toggleAudio}/>}
        {role==='doctor'&&<DoctorMode lang={lang} audioOn={audioOn} showToast={showToast} queue={queue} markSeen={markSeen}/>}
        {role==='admin'&&<AdminMode lang={lang} queue={queue}/>}
      </main>
      {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      <ChatBot lang={lang} audioOn={audioOn} role={role}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
