<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>MediNode v4 — AI Clinical Intake System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --n900:#0B1D3A;--n800:#1E3A8A;--n700:#2D4FA8;--n600:#3B63C9;--n500:#4F7BE8;
  --g900:#064E3B;--g800:#15803D;--g700:#16A34A;--g600:#22C55E;--g500:#4ADE80;
  --r:#DC2626;--rp:#FFF0F0;--amb:#F59E0B;
  --sl:#F0F4FA;--sl2:#E4EBF5;--sl3:#C8D6EC;--sl4:#8FA8CC;
  --t1:#0B1D3A;--t2:#3D5A80;--t3:#7A96B8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--sl);color:var(--t1);min-height:100vh;overflow-x:hidden}
#root{min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--sl3);border-radius:3px}

.hdr{background:linear-gradient(135deg,var(--n900) 0%,var(--n800) 60%,#1a4fa0 100%);color:#fff;padding:0 22px;height:62px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:200;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.logo{display:flex;align-items:center;gap:9px}
.logo-ic{width:34px;height:34px;background:linear-gradient(135deg,var(--g700),var(--g600));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 4px 12px rgba(21,128,61,.4)}
.logo-tx{font-size:18px;font-weight:900;letter-spacing:-.5px}
.logo-tx em{color:#4ADE80;font-style:normal}
.logo-sb{font-size:9px;color:rgba(255,255,255,.45);margin-top:1px}
.rsw{display:flex;background:rgba(255,255,255,.1);border-radius:40px;padding:3px;gap:2px;border:1px solid rgba(255,255,255,.15)}
.rbtn{padding:6px 15px;border-radius:36px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .25s;color:rgba(255,255,255,.65);background:transparent;position:relative}
.rbtn.on{background:linear-gradient(135deg,var(--g700),var(--g600));color:#fff;box-shadow:0 4px 14px rgba(21,128,61,.5)}
.rbtn .qdot{position:absolute;top:-2px;right:-2px;background:var(--r);color:#fff;font-size:8px;font-weight:900;min-width:15px;height:15px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--n800)}
.hdr-r{display:flex;align-items:center;gap:7px}
.lpill,.apill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;outline:none;display:flex;align-items:center;gap:5px}
.lpill option{background:#fff;color:var(--t1)}
.apill.muted{background:rgba(220,38,38,.25);border-color:rgba(220,38,38,.4)}
.abha-chip{background:linear-gradient(135deg,#064E3B,#15803D);color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.5px}
.main{padding-top:62px;min-height:100vh}

.hero{min-height:calc(100vh - 62px);background:linear-gradient(135deg,#0B1D3A 0%,#1E3A8A 40%,#15803D 100%);position:relative;display:flex;align-items:stretch;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 70% 50%,rgba(21,128,61,.25),transparent 70%)}
.hero-l{flex:1;display:flex;flex-direction:column;justify-content:center;padding:46px 42px;position:relative;z-index:2;max-width:490px}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.3);color:#4ADE80;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:22px}
.hero-dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px #4ADE80;animation:dp 2s infinite}
@keyframes dp{0%,100%{opacity:1}50%{opacity:.4}}
.hero-t{font-size:46px;font-weight:900;color:#fff;line-height:1.05;letter-spacing:-1.5px;margin-bottom:15px}
.hero-t span{background:linear-gradient(135deg,#4ADE80,#22C55E);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-s{font-size:14px;color:rgba(255,255,255,.65);line-height:1.7;margin-bottom:28px;max-width:390px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat-v{font-size:26px;font-weight:900;color:#4ADE80;line-height:1}
.hstat-l{font-size:10px;color:rgba(255,255,255,.5);margin-top:3px}
.hero-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.hpill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.85);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600}
.hero-r{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 42px 32px 0;position:relative;z-index:2;min-width:450px}

.acard{width:100%;max-width:430px;background:rgba(255,255,255,.98);border-radius:26px;box-shadow:0 32px 80px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.6);overflow:hidden;animation:ci .5s cubic-bezier(.34,1.2,.64,1)}
@keyframes ci{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.acard-hdr{background:linear-gradient(135deg,var(--n900),var(--n800));padding:18px 24px 32px;position:relative}
.acard-hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:24px;background:rgba(255,255,255,.98);border-radius:50% 50% 0 0/17px 17px 0 0}
.acard-body{padding:14px 24px 24px;max-height:calc(100vh - 130px);overflow-y:auto}
.tbar{display:flex;background:var(--sl);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
.tbtn{flex:1;padding:9px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .25s;background:transparent;color:var(--t2)}
.tbtn.on{background:#fff;color:var(--n800);box-shadow:0 2px 8px rgba(11,29,58,.12)}
.idbar{display:flex;gap:6px;margin-bottom:12px}
.idbtn{flex:1;padding:9px;border-radius:9px;border:2px solid var(--sl2);cursor:pointer;font-size:12px;font-weight:600;background:#fff;color:var(--t2);transition:all .2s}
.idbtn.on{border-color:var(--n800);background:linear-gradient(135deg,#EEF3FF,#E8F5FF);color:var(--n800)}

/* VOICE FIELD */
.vf{margin-bottom:11px}
.vf-lbl{font-size:10px;font-weight:800;color:var(--t2);margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:6px;letter-spacing:.4px;text-transform:uppercase;min-height:16px}
.vf-acts{display:flex;gap:3px;flex-shrink:0}
.icon-btn{background:var(--sl);border:1px solid var(--sl2);cursor:pointer;font-size:11px;border-radius:6px;padding:3px 7px;transition:all .15s;color:var(--t2);display:inline-flex;align-items:center;gap:3px;font-weight:700;line-height:1.4}
.icon-btn:hover{background:var(--n800);color:#fff;border-color:var(--n800)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.rec{background:var(--r);color:#fff;border-color:var(--r);animation:recPulse .8s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.vf-wrap{position:relative}
.vf-in{width:100%;padding:11px 42px 11px 13px;border:2px solid var(--sl2);border-radius:11px;font-size:13px;font-family:inherit;outline:none;transition:all .2s;background:#fff;color:var(--t1);line-height:1.4}
.vf-in:focus{border-color:var(--n700);box-shadow:0 0 0 3px rgba(30,58,138,.08)}
.vf-in.err{border-color:var(--r);box-shadow:0 0 0 3px rgba(220,38,38,.08)}
.vf-in.rec{border-color:var(--r);background:#FFF8F8}
.vf-ta{width:100%;padding:11px 42px 11px 13px;border:2px solid var(--sl2);border-radius:11px;font-size:13px;font-family:inherit;outline:none;transition:all .2s;background:#fff;color:var(--t1);resize:vertical;min-height:70px;line-height:1.5}
.vf-ta:focus{border-color:var(--n700);box-shadow:0 0 0 3px rgba(30,58,138,.08)}
.vf-ta.rec{border-color:var(--r);background:#FFF8F8}
.vf-mic{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;background:var(--sl2);color:var(--t2);z-index:5;padding:0}
.vf-mic:hover{background:var(--n800);color:#fff}
.vf-mic.rec{background:var(--r);color:#fff;animation:recPulse .8s infinite}
.vf-mic-mid{top:50%;transform:translateY(-50%)}
.vf-err{font-size:10px;color:var(--r);margin-top:4px;font-weight:600}
.vf-hint{font-size:10px;color:var(--t3);margin-top:3px}
.vf-rec-bar{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#FEF2F2,#FFF1F1);border:1px solid rgba(220,38,38,.2);border-radius:9px;padding:7px 11px;margin-top:6px}
.wvf{display:flex;align-items:center;gap:2px;height:22px}
.wvb{width:3px;border-radius:2px;background:var(--r);transition:height .08s}

.btn{padding:12px 20px;border-radius:11px;border:none;cursor:pointer;font-size:14px;font-weight:700;transition:all .25s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,var(--n800),var(--n700));color:#fff;box-shadow:0 5px 18px rgba(30,58,138,.35)}
.btn-p:hover{box-shadow:0 7px 24px rgba(30,58,138,.45);transform:translateY(-1px)}
.btn-p:disabled{background:var(--sl3);box-shadow:none;cursor:not-allowed;transform:none}
.btn-g{background:linear-gradient(135deg,var(--g800),var(--g700));color:#fff;box-shadow:0 5px 18px rgba(21,128,61,.35)}
.btn-g:hover{box-shadow:0 7px 24px rgba(21,128,61,.45);transform:translateY(-1px)}
.btn-g:disabled{background:var(--sl3);box-shadow:none;cursor:not-allowed}
.btn-o{background:transparent;border:2px solid var(--n800);color:var(--n800)}
.btn-o:hover{background:var(--n800);color:#fff}
.btn-gh{background:var(--sl);color:var(--t2);border:1px solid var(--sl2)}
.btn-gh:hover{background:var(--sl2)}
.btn-w{width:100%}.btn-lg{padding:14px 24px;font-size:15px;border-radius:12px}
.btn-sm{padding:7px 13px;font-size:11px;border-radius:8px}

.csnt{background:linear-gradient(135deg,#F0F7FF,#F0FDF7);border:1.5px solid rgba(30,58,138,.12);border-radius:14px;padding:15px;margin-bottom:11px}
.csnt-h{font-size:11px;font-weight:800;color:var(--n800);margin-bottom:11px;letter-spacing:.4px;text-transform:uppercase}
.csnt-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid rgba(30,58,138,.07)}
.csnt-row:last-child{border-bottom:none;padding-bottom:0}
.csnt-hit{display:flex;align-items:flex-start;gap:10px;flex:1;cursor:pointer}
.cbox{width:21px;height:21px;min-width:21px;border-radius:6px;border:2.5px solid var(--sl3);background:#fff;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.cbox.ck{background:linear-gradient(135deg,var(--n800),var(--n700));border-color:var(--n800);box-shadow:0 3px 10px rgba(30,58,138,.3)}
.cbox.ck::after{content:'✓';color:#fff;font-size:12px;font-weight:900;line-height:1}
.csnt-tx{font-size:12px;color:var(--t2);line-height:1.5;user-select:none}

.hosp-sec{margin-bottom:13px}
.hosp-h{font-size:10px;font-weight:800;color:var(--t2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.hosp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hosp-c{background:#fff;border:2px solid var(--sl2);border-radius:12px;padding:10px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.hosp-c::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--n800),var(--g700));opacity:0;transition:opacity .2s}
.hosp-c:hover,.hosp-c.sel{border-color:var(--n700);box-shadow:0 3px 14px rgba(30,58,138,.14)}
.hosp-c:hover::before,.hosp-c.sel::before{opacity:1}
.hosp-c.sel{background:linear-gradient(135deg,#EEF3FF,#F0FDF7)}
.hosp-n{font-size:12px;font-weight:700;color:var(--n900);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:34px}
.hosp-m{font-size:10px;color:var(--t3);line-height:1.5}
.hosp-b{position:absolute;top:7px;right:7px;background:linear-gradient(135deg,var(--g800),var(--g700));color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:9px}
.loc-btn{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--n800),var(--n700));color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;margin-bottom:7px;transition:all .2s;width:100%;justify-content:center}
.loc-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(30,58,138,.3)}
.loc-btn:disabled{background:var(--sl2);color:var(--t2);cursor:default;transform:none;box-shadow:none}
.spin{width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.bdg{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.bdg-r{background:#FEE2E2;color:#DC2626}.bdg-a{background:#FEF3C7;color:#D97706}
.bdg-g{background:#DCFCE7;color:#15803D}.bdg-b{background:#DBEAFE;color:#1E3A8A}
.bdg-p{background:#EDE9FE;color:#7C3AED}.bdg-t{background:#CCFBF1;color:#0D9488}
.bdg-new{background:linear-gradient(135deg,var(--g700),var(--g600));color:#fff;animation:newPulse 2s infinite}
@keyframes newPulse{0%,100%{opacity:1}50%{opacity:.6}}

.pgb{height:6px;background:var(--sl2);border-radius:3px;overflow:hidden}
.pgf{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.pgf-n{background:linear-gradient(90deg,var(--n700),var(--n500))}
.pgf-g{background:linear-gradient(90deg,var(--g800),var(--g600))}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(11,29,58,.06);padding:18px;border:1px solid rgba(0,0,0,.04)}

/* MCQ — no nested buttons */
.mcq-row{display:flex;align-items:stretch;gap:5px;margin-bottom:7px}
.mcqo{flex:1;padding:12px 13px;border-radius:11px;border:2px solid var(--sl2);background:#fff;cursor:pointer;text-align:left;font-size:13px;font-weight:500;transition:all .2s;display:flex;align-items:center;gap:10px;color:var(--t1)}
.mcqo:hover{border-color:var(--n600);background:#F8FAFF}
.mcqo.on{border-color:var(--n800);background:linear-gradient(135deg,#EEF3FF,#E8F0FF);color:var(--n800);box-shadow:0 3px 12px rgba(30,58,138,.12)}
.mcql{width:25px;height:25px;min-width:25px;border-radius:7px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;opacity:.5;transition:all .2s}
.mcqo.on .mcql{opacity:1;background:var(--n800);color:#fff;border-color:var(--n800)}
.mcq-spk{width:34px;border-radius:10px;border:2px solid var(--sl2);background:var(--sl);cursor:pointer;font-size:13px;color:var(--t2);transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mcq-spk:hover{background:var(--n800);color:#fff;border-color:var(--n800)}
.mcq-spk:active{transform:scale(.93)}
.mcq-vbar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(135deg,#FEF2F2,#FFF1F1);border-radius:10px;margin-bottom:10px;border:1px solid rgba(220,38,38,.2)}
.heard{font-size:11px;color:var(--g800);font-weight:700;margin-bottom:8px;padding:5px 10px;background:#F0FDF4;border-radius:7px;border:1px solid rgba(21,128,61,.2)}

.svsl{-webkit-appearance:none;width:100%;height:10px;border-radius:5px;background:linear-gradient(90deg,#22C55E,#EAB308,#DC2626);outline:none;cursor:pointer}
.svsl::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--n800);cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.pface{font-size:24px;cursor:pointer;transition:all .25s;filter:saturate(0) brightness(1.3);opacity:.4;background:none;border:none;padding:0}
.pface.on{filter:saturate(1) brightness(1);opacity:1;transform:scale(1.35)}

.trp{border-left:4px solid}.tr-r{border-color:#DC2626}.tr-a{border-color:#F59E0B}.tr-g{border-color:#22C55E}
.emsc{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#7F1D1D,#991B1B,#DC2626);overflow:hidden}
.emsc::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,255,255,.06),transparent 70%);animation:emp 1.5s infinite}
@keyframes emp{0%,100%{opacity:.4}50%{opacity:1}}
.em-ic{font-size:84px;animation:emb 1s ease infinite alternate}
@keyframes emb{from{transform:scale(1)}to{transform:scale(1.1)}}
.em-tok{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:22px;padding:20px 42px;text-align:center;margin:20px 0}

.qsb{background:var(--n900);width:290px;flex-shrink:0;overflow-y:auto;height:calc(100vh - 62px)}
.qhdr{padding:15px 15px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.qpt{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;transition:all .2s;position:relative}
.qpt.on{background:rgba(255,255,255,.1)}
.qpt:hover{background:rgba(255,255,255,.07)}
.qpt.fresh{background:rgba(34,197,94,.12);animation:freshIn .6s ease}
@keyframes freshIn{from{background:rgba(34,197,94,.35)}to{background:rgba(34,197,94,.12)}}

.vtg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vtc{background:var(--sl);border-radius:11px;padding:9px 10px;text-align:center;border:1px solid var(--sl2)}
.vtv{font-size:16px;font-weight:900;color:var(--n800);line-height:1.1}
.vtl{font-size:9px;color:var(--t3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.soap{background:var(--sl);border-radius:9px;padding:11px 13px;margin-bottom:8px;border-left:3px solid var(--n700)}
.soapk{font-size:9px;font-weight:800;color:var(--n700);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.fhirb{background:#0B1D3A;border-radius:12px;padding:16px;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.7;color:#4ADE80;overflow:auto;max-height:340px;border:1px solid rgba(74,222,128,.15)}

.mbig{font-size:36px;font-weight:900;line-height:1;letter-spacing:-1px}
.krow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--sl2)}
.krow:last-child{border:none}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pdot.on{background:var(--g600);animation:pon 2s infinite}
.pdot.warn{background:var(--amb);animation:pon 1s infinite}
.pdot.off{background:var(--r)}
@keyframes pon{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.4)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}}
.logr{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--sl);align-items:flex-start}
.logt{font-family:'JetBrains Mono',monospace;color:var(--t3);flex-shrink:0;font-size:10px;padding-top:1px}

.ocrz{border:2.5px dashed var(--sl3);border-radius:18px;padding:30px 18px;text-align:center;cursor:pointer;transition:all .25s;background:var(--sl)}
.ocrz:hover,.ocrz.dg{border-color:var(--n700);background:#EEF3FF}
.stpr{display:flex;align-items:center}

const languageMeta=lang=>LANGUAGES.find(x=>x.id===lang)||LANGUAGES[0];

/* Translate the remaining legacy English copy (doctor/admin cards, demo
   content, labels, and buttons) without changing any markup or layout.
   Form controls are excluded. Results are cached for the browser session. */
const pageSource=new WeakMap(),pageTranslationCache=new Map();
const translationTarget={brx:'hi',doi:'hi',kok:'mr',mai:'hi',mni:'bn',sat:'hi'};
const SKIP_TRANSLATE_RE=/^[-–—→✓•🔊🎤⚕📍💬\d\s]+$/u;
async function translateOwnedCopy(source,lang){
  if(!source||lang==='en'||SKIP_TRANSLATE_RE.test(source))return source;
  const key=`${lang}|${source}`;
  if(pageTranslationCache.has(key))return pageTranslationCache.get(key);
  const target=translationTarget[lang]||lang;
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(target)}&dt=t&q=${encodeURIComponent(source)}`;
    const result=await fetch(url,{credentials:'omit'}).then(r=>r.ok?r.json():Promise.reject(r.status));
    const translated=(result?.[0]||[]).map(part=>part[0]).join('')||source;
    pageTranslationCache.set(key,translated);
    return translated;
  }catch(e){
    console.warn('MediNode UI translation unavailable',e);
    return source;
  }
}
function usePageLanguage(lang,rootRef){
  useEffect(()=>{
    const root=rootRef.current;if(!root)return;
    let cancelled=false,timer;
    document.documentElement.lang=languageMeta(lang).locale;
    document.documentElement.dir=lang==='ur'||lang==='ks'||lang==='sd'?'rtl':'ltr';
    const translate=async()=>{
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
        const p=n.parentElement;
        if(!p||!n.nodeValue.trim()||p.closest('script,style,textarea,input,select,option,[data-no-auto-translate]'))return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }});
      const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
      // Only touch nodes whose live text differs from the text WE last wrote to them.
      // React reuses the same text node across re-renders (e.g. stepping through the
      // SOCRATES questionnaire), so a node's content can legitimately change out from
      // under us. Treating a node's first-ever value as its permanent "source" (the old
      // behaviour) caused this observer to silently overwrite freshly-rendered questions,
      // options and progress counters with whatever text happened to be there originally.
      // Instead we always re-derive "source" from the node's CURRENT value, and only skip
      // nodes that already show exactly the output we produced last pass (so we don't
      // re-translate our own translated text and loop forever).
      const dirty=nodes.filter(n=>{
        const cache=pageSource.get(n);
        return !cache||cache.out!==n.nodeValue;
      });
      for(let i=0;i<dirty.length;i+=8){
        const batch=dirty.slice(i,i+8);
        const sources=batch.map(n=>String(n.nodeValue||'').trim());
        const values=await Promise.all(sources.map(s=>translateOwnedCopy(s,lang)));
        if(cancelled)return;
        batch.forEach((n,j)=>{
          if(!n.isConnected)return;
          // React may have changed this node again while we were awaiting the
          // translation above — if so, this pass is stale, skip it and let the
          // next mutation-triggered pass (which will see the newer text) handle it.
          if(n.nodeValue.trim()!==sources[j])return;
          if(n.nodeValue!==values[j])n.nodeValue=values[j];
          pageSource.set(n,{out:values[j]});
        });
      }
    };
    const observe=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(translate,80);});
    observe.observe(root,{subtree:true,childList:true,characterData:true});
    translate();
    return()=>{cancelled=true;clearTimeout(timer);observe.disconnect();};
  },[lang,rootRef]);
}

/* ══════ SPEECH ENGINE (singleton, robust) ══════ */
const Speech={
  ready:false,voices:[],
  init(){
    if(!window.speechSynthesis)return;
    const load=()=>{this.voices=window.speechSynthesis.getVoices();this.ready=this.voices.length>0;};
    load();
    window.speechSynthesis.onvoiceschanged=load;
  },
  pickVoice(lang){
    const want=languageMeta(lang).locale.split('-')[0];
    let v=this.voices.find(x=>x.lang?.toLowerCase().startsWith(want+'-in'));
    if(!v)v=this.voices.find(x=>x.lang?.toLowerCase().startsWith(want));
    return v||null;
  },
  speak(text,lang){
    if(!window.speechSynthesis||!text)return;
    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(String(text));
      u.lang=languageMeta(lang).locale;
      const v=this.pickVoice(lang);
      if(v)u.voice=v;
      u.rate=.9;u.pitch=1.02;u.volume=1;
      // Chrome bug workaround: resume if paused
      if(window.speechSynthesis.paused)window.speechSynthesis.resume();
      window.speechSynthesis.speak(u);
    }catch(e){console.warn('TTS error',e);}
  },
  stop(){try{window.speechSynthesis?.cancel();}catch(e){}}
};
Speech.init();

/* Convert spoken number words -> digits (for voice OTP / numbers) */
const NUMWORDS={zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',
  'शून्य':'0','एक':'1','दो':'2','तीन':'3','चार':'4','पांच':'5','पाँच':'5','छह':'6','छः':'6','सात':'7','आठ':'8','नौ':'9'};
function voiceToDigits(txt){
  let s=String(txt).toLowerCase();
  Object.entries(NUMWORDS).forEach(([w,d])=>{s=s.replace(new RegExp(w,'g'),d);});
  return s.replace(/\D/g,'');
}

/* ══════ HOOKS ══════ */
function useSpeak(lang,audioOn){
  return useCallback((text,force)=>{
    if(!audioOn&&!force)return;
    Speech.speak(text,lang);
  },[lang,audioOn]);
}

/* Speech recognition — one active instance at a time */
function useMic(lang){
  const [supported]=useState(()=>!!(window.SpeechRecognition||window.webkitSpeechRecognition));
  const recRef=useRef(null);
  const stop=useCallback(()=>{
    try{recRef.current?.abort?.();recRef.current?.stop?.();}catch(e){}
    recRef.current=null;
  },[]);
  const start=useCallback((onResult,onDone)=>{
    if(!supported){onDone&&onDone('unsupported');return false;}
    stop();
    try{
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      const r=new SR();
       r.lang=languageMeta(lang).locale;
      r.continuous=false;r.interimResults=false;r.maxAlternatives=1;
      r.onresult=e=>{
        const txt=e.results?.[0]?.[0]?.transcript||'';
        onResult&&onResult(txt);
      };
      r.onerror=ev=>{recRef.current=null;onDone&&onDone(ev.error||'error');};
      r.onend=()=>{recRef.current=null;onDone&&onDone(null);};
      recRef.current=r;
      r.start();
      return true;
    }catch(e){recRef.current=null;onDone&&onDone('failed');return false;}
  },[lang,supported,stop]);
  useEffect(()=>()=>stop(),[stop]);
  return{supported,start,stop};
}

/* ══════ WAVEFORM ══════ */
function Waveform({on,color}){
  const [h,setH]=useState(()=>Array(14).fill(5));
  useEffect(()=>{
    if(!on){setH(Array(14).fill(5));return;}
    const iv=setInterval(()=>setH(Array(14).fill(0).map(()=>5+Math.random()*16)),90);
    return()=>clearInterval(iv);
  },[on]);
  return <div className="wvf">{h.map((v,i)=><div key={i} className="wvb" style={{height:v,background:color||'var(--r)'}}/>)}</div>;
}

/* ══════ VOICE FIELD — every input speaks & listens ══════ */
function VField({label,value,onChange,placeholder,lang,audioOn,multiline,error,hint,numeric,showToast,t}){
  const [rec,setRec]=useState(false);
  const [heard,setHeard]=useState('');
  const speak=useSpeak(lang,audioOn);
  const {supported,start,stop}=useMic(lang);

  const handleMic=useCallback((e)=>{
    e?.preventDefault?.();
    e?.stopPropagation?.();
    if(rec){stop();setRec(false);return;}
    Speech.stop();
    const ok=start(
      txt=>{
        const out=numeric?voiceToDigits(txt):txt;
        onChange(out);
        setHeard(txt);
        setTimeout(()=>setHeard(''),4000);
      },
      err=>{
        setRec(false);
        if(err==='unsupported'&&showToast)showToast('Voice input not supported in this browser — please type','warning');
        else if(err==='not-allowed'&&showToast)showToast('Microphone blocked — allow mic access in browser settings','error');
      }
    );
    if(ok)setRec(true);
  },[rec,start,stop,onChange,numeric,showToast]);

  const handleSpeak=useCallback((e)=>{
    e?.preventDefault?.();
    e?.stopPropagation?.();
    const say=value?.trim()?`${label}. ${value}`:label;
    speak(say,true); // force = always speak on explicit tap
  },[label,value,speak]);

  return(
    <div className="vf">
      <div className="vf-lbl">
        <span>{label}</span>
        <div className="vf-acts">
          <button type="button" className="icon-btn" onClick={handleSpeak} title="Read aloud">🔊</button>
          {supported&&(
            <button type="button" className={`icon-btn ${rec?'rec':''}`} onClick={handleMic} title="Speak your answer">
              {rec?'🔴 Stop':'🎤 '+t('speakField')}
            </button>
          )}
        </div>
      </div>
      <div className="vf-wrap">
        {multiline?(
          <textarea className={`vf-ta ${error?'err':''} ${rec?'rec':''}`} value={value}
            onChange={e=>onChange(e.target.value)} placeholder={placeholder||''}/>
        ):(
          <input className={`vf-in ${error?'err':''} ${rec?'rec':''}`} value={value}
            onChange={e=>onChange(e.target.value)} placeholder={placeholder||''}
            inputMode={numeric?'numeric':'text'}/>
        )}
        {supported&&(
          <button type="button" className={`vf-mic ${multiline?'':'vf-mic-mid'} ${rec?'rec':''}`}
            onClick={handleMic} title={rec?'Stop':'Speak'}>{rec?'🔴':'🎤'}</button>
        )}
      </div>
      {rec&&(
        <div className="vf-rec-bar">
          <Waveform on={true}/>
          <span style={{fontSize:11,color:'var(--r)',fontWeight:700}}>{t('listening')}</span>
        </div>
      )}
      {heard&&!rec&&<div className="heard">🎤 {t('heard')}: "{heard}"</div>}
      {error&&<div className="vf-err">⚠ {error}</div>}
      {hint&&!error&&<div className="vf-hint">{hint}</div>}
    </div>
  );
}

/* ══════ MCQ — flat buttons, no nesting ══════ */
function MCQ({q,opts,sel,onSel,multi,lang,audioOn,t,showToast}){
  const [rec,setRec]=useState(false);
  const [heard,setHeard]=useState('');
  const speak=useSpeak(lang,audioOn);
  const {supported,start,stop}=useMic(lang);

  useEffect(()=>{speak(q);},[q]);

  function matchOption(txt){
    const low=txt.toLowerCase().trim();
    // Letter match: "a", "option b", "बी"
    for(let i=0;i<opts.length;i++){
      const L=String.fromCharCode(97+i);
      if(low===L||low===`option ${L}`||low===`${L}.`||low.startsWith(L+' '))return opts[i];
    }
    // Number match: "one","1"
    const num=parseInt(voiceToDigits(low));
    if(num>=1&&num<=opts.length)return opts[num-1];
    // Fuzzy text match — score by shared words
    let best=null,bestScore=0;
    opts.forEach(o=>{
      const ow=o.toLowerCase().replace(/[^\w\s\u0900-\u097F]/g,' ').split(/\s+/).filter(w=>w.length>2);
      let score=0;
      ow.forEach(w=>{if(low.includes(w))score+=w.length;});
      if(low.includes(o.toLowerCase().slice(0,6)))score+=6;
      if(score>bestScore){bestScore=score;best=o;}
    });
    return bestScore>=3?best:null;
  }

  const handleMic=useCallback(e=>{
    e?.preventDefault?.();e?.stopPropagation?.();
    if(rec){stop();setRec(false);return;}
    Speech.stop();
    const ok=start(
      txt=>{
        setHeard(txt);
        const m=matchOption(txt);
        if(m){
          if(multi){const p=sel||[];onSel(p.includes(m)?p.filter(x=>x!==m):[...p,m]);}
          else onSel(m);
          speak(m);
        }else if(showToast){showToast(`Didn't catch that — heard "${txt}". Try the option letter (A, B, C…)`,'warning');}
        setTimeout(()=>setHeard(''),5000);
      },
      err=>{
        setRec(false);
        if(err==='not-allowed'&&showToast)showToast('Microphone blocked — allow mic access','error');
      }
    );
    if(ok)setRec(true);
  },[rec,start,stop,opts,sel,multi,onSel,speak,showToast]);

  const isSel=o=>multi?(sel||[]).includes(o):sel===o;

  return(
    <div className="fu">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:11,gap:8}}>
        <p style={{fontWeight:700,fontSize:14,color:'var(--t1)',lineHeight:1.5,flex:1}}>{q}</p>
        <div style={{display:'flex',gap:4,flexShrink:0}}>
          <button type="button" className="icon-btn" onClick={e=>{e.stopPropagation();speak(q,true);}} title="Read question">🔊</button>
          {supported&&<button type="button" className={`icon-btn ${rec?'rec':''}`} onClick={handleMic} title="Speak answer">{rec?'🔴 Stop':'🎤 Speak'}</button>}
        </div>
      </div>
      {rec&&(
        <div className="mcq-vbar">
          <Waveform on={true}/>
          <span style={{fontSize:11,color:'var(--r)',fontWeight:700}}>Say the option name or its letter (A, B, C…)</span>
        </div>
      )}
      {heard&&!rec&&<div className="heard">🎤 {t('heard')}: "{heard}"</div>}
      {opts.map((o,i)=>(
        <div key={i} className="mcq-row">
          <button type="button" className={`mcqo ${isSel(o)?'on':''}`}
            onClick={()=>{speak(o);if(multi){const p=sel||[];onSel(p.includes(o)?p.filter(x=>x!==o):[...p,o]);}else onSel(o);}}>
            <span className="mcql">{String.fromCharCode(65+i)}</span>
            <span>{o}</span>
          </button>
          <button type="button" className="mcq-spk" onClick={e=>{e.stopPropagation();speak(o,true);}} title="Hear this option">🔊</button>
        </div>
      ))}
    </div>
  );
}

}

/* ══════ OCR ══════ */
function OCRModule({lang,t,showToast,onExtracted}){
  const [prev,setPrev]=useState(null);const [pct,setPct]=useState(0);
  const [busy,setBusy]=useState(false);const [res,setRes]=useState(null);const [drag,setDrag]=useState(false);
  const fRef=useRef();
  const DRUG_RE=/\b(metformin|amlodipine|aspirin|atorvastatin|metoprolol|lisinopril|losartan|pantoprazole|omeprazole|paracetamol|ibuprofen|clopidogrel|warfarin|ramipril|telmisartan|rosuvastatin|glimepiride|sitagliptin|digoxin|furosemide|levothyroxine|insulin|gabapentin|prednisolone)\b/gi;
  const LAB_RE=[
    {re:/(?:hb|h[ae]moglobin)\s*[:\-=]?\s*([\d.]+)/i,n:'Hemoglobin',u:'g/dL',lo:10},
    {re:/(?:fbs|fasting\s*blood\s*sugar|glucose)\s*[:\-=]?\s*([\d.]+)/i,n:'Fasting Blood Sugar',u:'mg/dL',hi:140},
    {re:/hba1c\s*[:\-=]?\s*([\d.]+)/i,n:'HbA1c',u:'%',hi:7},
    {re:/creatinine\s*[:\-=]?\s*([\d.]+)/i,n:'Creatinine',u:'mg/dL',hi:1.2},
    {re:/(?:vit(?:amin)?\s*d|25\s*oh)\s*[:\-=]?\s*([\d.]+)/i,n:'Vitamin D',u:'ng/mL',lo:30},
    {re:/(?:tsh)\s*[:\-=]?\s*([\d.]+)/i,n:'TSH',u:'mIU/L',hi:4.5},
    {re:/(?:crp)\s*[:\-=]?\s*([\d.]+)/i,n:'CRP',u:'mg/L',hi:5},
  ];
  function extract(txt){
    const drugs=[...new Set((txt.match(DRUG_RE)||[]).map(s=>s.trim()))];
    const labs=[];
    LAB_RE.forEach(({re,n,u,lo,hi})=>{
      const m=txt.match(re);
      if(m){const val=parseFloat(m[1]);
        labs.push({n,v:`${m[1]} ${u}`,flag:(lo&&val<lo)||(hi&&val>hi),ref:lo?`>${lo} ${u}`:`<${hi} ${u}`});}
    });
    const interactions=[];const ds=drugs.join(' ').toLowerCase();
    if(ds.includes('aspirin')&&ds.includes('warfarin'))interactions.push('Aspirin + Warfarin: increased bleeding risk');
    if(ds.includes('metformin')&&ds.includes('contrast'))interactions.push('Metformin + Contrast: lactic acidosis risk');
    if(ds.includes('digoxin')&&ds.includes('furosemide'))interactions.push('Digoxin + Furosemide: hypokalemia → digoxin toxicity');
    if(ds.includes('clopidogrel')&&ds.includes('omeprazole'))interactions.push('Clopidogrel + Omeprazole: reduced antiplatelet effect');
    return{drugs,labs,interactions,rawLength:txt.length};
  }
  async function runOCR(f){
    if(!f)return;
    if(!f.type.startsWith('image/')){showToast(t('ocrFail'),'error');return;}
    setPrev(URL.createObjectURL(f));setBusy(true);setPct(0);setRes(null);
    try{
      const worker=await Tesseract.createWorker(lang==='hi'?'hin':'eng',1,{
        logger:m=>{if(m.status==='recognizing text')setPct(Math.round((m.progress||0)*100));}
      });
      const {data:{text}}=await worker.recognize(f);
      await worker.terminate();
      const ex=extract(text||'');
      setRes(ex);onExtracted(ex);
      showToast(t('uploadOk'),'success');
    }catch(e){console.error(e);showToast(t('ocrFail'),'error');}
    finally{setBusy(false);}
  }
  return(
    <div className="fu">
      <input ref={fRef} type="file" accept="image/*" capture="environment" style={{display:'none'}}
        onChange={e=>{const f=e.target.files?.[0];if(f)runOCR(f);e.target.value='';}}/>
      <div className={`ocrz ${drag?'dg':''}`}
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);runOCR(e.dataTransfer.files?.[0]);}}
        onClick={()=>fRef.current?.click()}>
        <div style={{fontSize:42,marginBottom:9}}>📄</div>
        <p style={{fontWeight:700,fontSize:14,color:'var(--t2)',marginBottom:3}}>{t('dragDrop')}</p>
        <p style={{fontSize:11,color:'var(--t3)'}}>JPEG · PNG · WebP · Camera</p>
      </div>
      {prev&&(
        <div style={{marginTop:13,display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-start'}}>
          <img src={prev} alt="" style={{width:112,borderRadius:10,border:'2px solid var(--sl2)',flexShrink:0}}/>
          <div style={{flex:1,minWidth:160}}>
            {busy&&(
              <div>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                  <span style={{fontSize:12,fontWeight:700}}>{t('ocrScanning')}…</span>
                  <span style={{fontSize:12,fontWeight:900,color:'var(--g800)'}}>{pct}%</span>
                </div>
                <div className="pgb"><div className="pgf pgf-n" style={{width:pct+'%'}}/></div>
                <div className="ail" style={{marginTop:9}}>
                  <div className="aid"><span/><span/><span/></div>
                  <span style={{fontSize:11,color:'var(--n800)',fontWeight:500}}>AI extracting medical entities…</span>
                </div>
              </div>
            )}
            {res&&!busy&&(
              <div className="fu">
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:9}}>
                  <span style={{fontSize:16}}>✅</span>
                  <span style={{fontWeight:800,color:'var(--g800)',fontSize:13}}>{t('ocrDone')}</span>
                </div>
                {res.drugs.length>0&&<div style={{marginBottom:9}}>
                  <div style={{fontSize:10,fontWeight:800,color:'var(--n800)',textTransform:'uppercase',marginBottom:5}}>💊 Medications</div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:4}}>{res.drugs.map((d,i)=><span key={i} className="bdg bdg-b">{d}</span>)}</div>
                </div>}
                {res.labs.length>0&&<div style={{marginBottom:9}}>
                  <div style={{fontSize:10,fontWeight:800,color:'var(--n800)',textTransform:'uppercase',marginBottom:5}}>🔬 Lab Values</div>
                  {res.labs.map((l,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderBottom:'1px solid var(--sl2)'}}>
                    <span style={{fontSize:11}}>{l.n}: <b>{l.v}</b></span>
                    {l.flag&&<span className="bdg bdg-r">⚠ Abnormal</span>}
                  </div>)}
                </div>}
                {res.interactions.length>0&&<div style={{background:'var(--rp)',borderRadius:9,padding:9}}>
                  <div style={{fontSize:10,fontWeight:800,color:'var(--r)',marginBottom:3}}>⚠ Drug Interactions</div>
                  {res.interactions.map((x,i)=><div key={i} style={{fontSize:11,color:'var(--r)'}}>{x}</div>)}
                </div>}
                {!res.drugs.length&&!res.labs.length&&<div style={{fontSize:11,color:'var(--t3)'}}>Text extracted but no known medications or lab values matched.</div>}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════ NEARBY HOSPITALS — real geolocation ══════ */
function NearbyHospitals({t,lang,audioOn,sel,onSel,showToast}){
  const [st,setSt]=useState('idle');
  const [loc,setLoc]=useState(null);
  const [list,setList]=useState(DEMO_HOSPITALS.map(h=>({...h,dist:h.baseDist.toFixed(1)+' km'})));
  const speak=useSpeak(lang,audioOn);

  function haversine(a1,o1,a2,o2){
    const R=6371,dLa=(a2-a1)*Math.PI/180,dLo=(o2-o1)*Math.PI/180;
    const x=Math.sin(dLa/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dLo/2)**2;
    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
  }
  function detect(){
    if(!navigator.geolocation){setSt('err');showToast&&showToast('Geolocation not supported','warning');return;}
    setSt('loading');
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const {latitude:la,longitude:lo}=pos.coords;
        setLoc({la,lo});
        const sorted=DEMO_HOSPITALS
          .map(h=>({...h,distNum:haversine(la,lo,h.lat,h.lng)}))
          .sort((a,b)=>a.distNum-b.distNum)
          .map(h=>({...h,dist:h.distNum.toFixed(1)+' km'}));
        setList(sorted);setSt('ok');
        speak(`Found ${sorted.length} A B H A hospitals near you. Nearest is ${sorted[0].name}, ${sorted[0].dist} away.`);
        showToast&&showToast(`Location found — nearest: ${sorted[0].name}`,'success');
      },
      err=>{
        setSt('err');
        const m=err.code===1?'Location permission denied':'Could not get location';
        showToast&&showToast(m+' — showing demo hospitals','warning');
      },
      {timeout:9000,enableHighAccuracy:true,maximumAge:60000}
    );
  }
  return(
    <div className="hosp-sec">
      <div className="hosp-h"><span style={{fontSize:13}}>📍</span>{t('nearbyTitle')}</div>
      <button type="button" className="loc-btn" onClick={detect} disabled={st==='loading'}>
        {st==='loading'&&<><span className="spin"/>{t('detecting')}</>}
        {st==='idle'&&t('detectLoc')}
        {st==='ok'&&<>✓ {loc.la.toFixed(3)}, {loc.lo.toFixed(3)}</>}
        {st==='err'&&t('retryLoc')}
      </button>
      {st==='ok'&&<p style={{fontSize:10,color:'var(--g800)',fontWeight:700,marginBottom:6}}>✓ {t('locFound')}</p>}
      {st==='err'&&<p style={{fontSize:10,color:'var(--amb)',fontWeight:700,marginBottom:6}}>⚠ {t('locErr')}</p>}
      <div className="hosp-grid">
        {list.map((h,i)=>(
          <div key={h.name} className={`hosp-c ${sel===i?'sel':''}`}
            onClick={()=>{onSel(i,h);speak(`${h.name}, ${h.dist} away, wait time ${h.wait}`);}}>
            <div className="hosp-b">ABHA ✓</div>
            <div className="hosp-n">{h.name}</div>
            <div className="hosp-m">{h.spec}<br/>📍{h.dist} · ⏱{h.wait} · ⭐{h.rating}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ══════ SOCRATES FLOW ══════ */
function SOCRATESFlow({t,lang,audioOn,showToast,onComplete}){
  const [i,setI]=useState(0);
  const [d,setD]=useState({});
  const [bodyPart,setBodyPart]=useState('');
  const [siteTxt,setSiteTxt]=useState('');
  const [free,setFree]=useState('');
  const [sev,setSev]=useState(5);
  const speak=useSpeak(lang,audioOn);

  const S=[
    {k:'chief',type:'text',q:t('chief'),ph:t('chiefPlh')},
    {k:'site',type:'body',q:t('s_site')},
    {k:'onset',type:'mcq',q:t('s_onset'),o:t('s_onset_opts')},
    {k:'character',type:'mcq',q:t('s_char'),o:t('s_char_opts')},
    {k:'radiation',type:'mcq',q:t('s_rad'),o:t('s_rad_opts')},
    {k:'associations',type:'multi',q:t('s_assoc'),o:t('s_assoc_opts')},
    {k:'time',type:'mcq',q:t('s_time'),o:t('s_time_opts')},
    {k:'exacerbating',type:'mcq',q:t('s_exac'),o:t('s_exac_opts')},
    {k:'severity',type:'sev',q:t('s_sev')},
    {k:'pastHx',type:'text',q:t('pastHx'),ph:t('pastHxPlh')},
    {k:'meds',type:'text',q:t('meds'),ph:t('medsPlh')},
  ];
  const cur=S[i];
  useEffect(()=>{setFree('');setSiteTxt('');},[i]);

  function emergencyCheck(x){
    const txt=`${x.chief||''} ${x.site?.part||''} ${x.site?.text||''}`.toLowerCase();
    const chest=/chest|सीन|seene|heart|दिल/.test(txt);
    const stroke=/stroke|paralysis|face droop|slurred|can.?t speak|लकवा/.test(txt);
    const tight=x.character===t('s_char_opts')[4];
    const arm=x.radiation===t('s_rad_opts')[1]||x.radiation===t('s_rad_opts')[2];
    const breath=(x.associations||[]).includes(t('s_assoc_opts')[1]);
    return stroke||(chest&&tight&&(arm||breath))||(chest&&x.severity>=8);
  }
  function go(val){
    const nd={...d,[cur.k]:val};setD(nd);
    if(i===S.length-1)onComplete(nd,emergencyCheck(nd));
    else setI(i+1);
  }
  const pct=((i+1)/S.length)*100;

  return(
    <div style={{maxWidth:600,margin:'0 auto',padding:'18px 16px'}} className="fu">
      <div style={{marginBottom:16}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontSize:12,fontWeight:700,color:'var(--t2)'}}>SOCRATES Clinical History — {i+1} / {S.length}</span>
          <span style={{fontSize:12,fontWeight:900,color:'var(--g800)'}}>{Math.round(pct)}%</span>
        </div>
        <div className="pgb" style={{height:7}}><div className="pgf pgf-n" style={{width:pct+'%'}}/></div>
        <div className="stpr" style={{marginTop:8}}>
          {S.map((s,x)=><React.Fragment key={s.k}>
            <div className={`std ${x<i?'dn':x===i?'ac':'pd'}`} style={{width:20,height:20,fontSize:8}}>{x<i?'✓':x+1}</div>
            {x<S.length-1&&<div className={`stl ${x<i?'dn':''}`}/>}
          </React.Fragment>)}
        </div>
      </div>

      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:11}}>
        <div className="ail" style={{flex:1}}>
          <div style={{width:29,height:29,borderRadius:9,background:'linear-gradient(135deg,var(--n800),var(--n600))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>🤖</div>
          <div>
            <div style={{fontSize:11,fontWeight:800,color:'var(--n800)'}}>AI Clinical Assistant</div>
            <div style={{fontSize:9,color:'var(--t3)'}}>Voice + Touch · SOCRATES</div>
          </div>
        </div>
        <button type="button" className="icon-btn" onClick={()=>speak(cur.q,true)} title="Read question">🔊 Read</button>
      </div>

      <div className="card" style={{padding:18,marginBottom:11}}>
        {cur.type==='text'&&(
          <div>
            <VField t={t} label={cur.q} value={free} onChange={setFree} placeholder={cur.ph}
              lang={lang} audioOn={audioOn} multiline showToast={showToast}/>
            <button type="button" className="btn btn-p btn-w" style={{marginTop:8}}
              disabled={cur.k!=='chief'?false:!free.trim()} onClick={()=>go(free.trim()||'Not provided')}>{t('next')}</button>
          </div>
        )}
        {cur.type==='body'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,gap:8}}>
              <p style={{fontWeight:700,fontSize:14,lineHeight:1.5,flex:1}}>{cur.q}</p>
              <button type="button" className="icon-btn" onClick={()=>speak(cur.q,true)}>🔊</button>
            </div>
            <div style={{display:'flex',gap:14,alignItems:'flex-start',flexWrap:'wrap'}}>
              <BodyMap sel={bodyPart} onSel={setBodyPart} lang={lang} audioOn={audioOn}/>
              <div style={{flex:1,minWidth:150}}>
                <VField t={t} label={t('bodyOr')} value={siteTxt} onChange={setSiteTxt}
                  placeholder="e.g. left side of chest…" lang={lang} audioOn={audioOn} showToast={showToast}/>
              </div>
            </div>
            <button type="button" className="btn btn-p btn-w" style={{marginTop:12}}
              disabled={!bodyPart&&!siteTxt.trim()} onClick={()=>go({part:bodyPart,text:siteTxt.trim()})}>{t('next')}</button>
          </div>
        )}
        {(cur.type==='mcq'||cur.type==='multi')&&(
          <div>
            <MCQ q={cur.q} opts={cur.o} sel={d[cur.k]} lang={lang} audioOn={audioOn} t={t} showToast={showToast}
              multi={cur.type==='multi'}
              onSel={v=>{if(cur.type==='multi')setD(p=>({...p,[cur.k]:v}));else go(v);}}/>
            {cur.type==='multi'&&
              <button type="button" className="btn btn-p btn-w" style={{marginTop:12}}
                disabled={!(d[cur.k]||[]).length} onClick={()=>go(d[cur.k]||[])}>{t('next')}</button>}
          </div>
        )}
        {cur.type==='sev'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16,gap:8}}>
              <p style={{fontWeight:700,fontSize:14,lineHeight:1.5,flex:1}}>{cur.q}</p>
              <button type="button" className="icon-btn" onClick={()=>speak(cur.q,true)}>🔊</button>
            </div>
            <div style={{display:'flex',justifyContent:'space-evenly',marginBottom:12}}>
              {PAIN_FACES.map((f,x)=>(
                <button key={x} type="button" className={`pface ${sev-1===x?'on':''}`}
                  onClick={()=>{setSev(x+1);speak(`${x+1} out of 10`);}}>{f}</button>
              ))}
            </div>
            <input type="range" className="svsl" min={1} max={10} value={sev} onChange={e=>setSev(+e.target.value)}/>
            <div style={{textAlign:'center',margin:'12px 0',fontSize:32,fontWeight:900,color:sev>=7?'var(--r)':sev>=4?'var(--amb)':'var(--g800)'}}>
              {sev}<span style={{fontSize:14,fontWeight:500,color:'var(--t3)',marginLeft:5}}>/10 · {sev<=3?'Mild':sev<=6?'Moderate':'Severe'}</span>
            </div>
            <VField t={t} label="Or say a number from 1 to 10" value={String(sev)}
              onChange={v=>{const n=parseInt(voiceToDigits(v));if(n>=1&&n<=10)setSev(n);}}
              lang={lang} audioOn={audioOn} numeric showToast={showToast}/>
            {sev>=8&&<div style={{background:'var(--rp)',borderRadius:10,padding:10,marginBottom:10,display:'flex',gap:8,alignItems:'center'}}>
              <span style={{fontSize:18}}>🚨</span><span style={{fontSize:12,color:'var(--r)',fontWeight:700}}>High severity — emergency triage check will run</span></div>}
            <button type="button" className="btn btn-p btn-w btn-lg" onClick={()=>go(sev)}>{t('next')}</button>
          </div>
        )}
      </div>
      {i>0&&<button type="button" className="btn btn-gh btn-sm" onClick={()=>setI(i-1)}>{t('back')}</button>}
    </div>
  );
}

/* ══════ AI SUMMARY GENERATOR (from real intake) ══════ */
function buildSummary(p){
  const d=p.intake||{};const g=p.gender==='Female'?'F':p.gender==='Male'?'M':'';
  const parts=[];
  parts.push(`${p.age}${g} presenting with ${d.chief||p.chief}.`);
  if(p.mode==='allopathy'){
    const site=d.site?.part?`${d.site.part}${d.site.text?` (${d.site.text})`:''}`:d.site?.text||'unspecified site';
    const bits=[];
    if(d.onset)bits.push(`onset ${d.onset.toLowerCase()}`);
    if(d.character)bits.push(`character ${d.character.toLowerCase()}`);
    if(d.radiation&&!/stays/i.test(d.radiation))bits.push(d.radiation.toLowerCase());
    if(d.time)bits.push(d.time.toLowerCase());
    if(d.exacerbating)bits.push(`aggravated by ${d.exacerbating.toLowerCase()}`);
    parts.push(`Pain localised to ${site}${bits.length?', '+bits.join(', '):''}.`);
    if(d.severity)parts.push(`Severity rated ${d.severity}/10 (${d.severity<=3?'mild':d.severity<=6?'moderate':'severe'}).`);
    if(d.associations?.length)parts.push(`Associated symptoms: ${d.associations.join(', ')}.`);
  }else{
    const ay=[];
    if(d.prakriti)ay.push(`Prakriti ${d.prakriti}`);
    if(d.vikriti)ay.push(`Vikriti ${d.vikriti}`);
    if(d.agni)ay.push(`Agni ${d.agni}`);
    if(d.koshtha)ay.push(`Koshtha ${d.koshtha}`);
    if(d.sara)ay.push(`Sara ${d.sara}`);
    if(d.sattva)ay.push(`Sattva ${d.sattva}`);
    if(ay.length)parts.push(`Dashavidha Pariksha — ${ay.join('; ')}.`);
    if(d.nidana)parts.push(`Nidana identified as ${d.nidana.toLowerCase()}.`);
  }
  if(d.pastHx&&d.pastHx!=='Not provided')parts.push(`Past history: ${d.pastHx}.`);
  if(d.meds&&d.meds!=='Not provided')parts.push(`Current medications: ${d.meds}.`);
  if(p.ocr?.drugs?.length)parts.push(`Documents show: ${p.ocr.drugs.join(', ')}.`);
  const abn=(p.ocr?.labs||[]).filter(l=>l.flag);
  if(abn.length)parts.push(`Abnormal labs: ${abn.map(l=>`${l.n} ${l.v}`).join(', ')}.`);
  if(p.ocr?.interactions?.length)parts.push(`⚠ ${p.ocr.interactions.join('; ')}.`);
  if(p.triage==='red')parts.push('RED FLAG — urgent clinical review required.');
  return parts.join(' ');
}

/* ══════ PATIENT MODE ══════ */
function PatientMode({lang,audioOn,showToast,addToQueue,easy,onEasyChange,onToggleAudio}){
  const t=useT(lang);
  const [screen,setScreen]=useState('landing');
  const [pt,setPt]=useState(null);
  const [mode,setMode]=useState('allopathy');
  const [intake,setIntake]=useState(null);
  const [ocr,setOcr]=useState(null);
  const [emerg,setEmerg]=useState(false);
  const [draft,setDraft]=useState(null);
  const [submitted,setSubmitted]=useState(false);

  function login(p){setPt(p);setScreen(p.consentDone?'mode':'consent');}

  function finishIntake(data,isEmergency){
    setIntake(data);
    if(isEmergency){setEmerg(true);makeDraft(data,null,'red');}
    else setScreen('ocr');
  }
  function makeDraft(data,ocrData,forceTriage){
    const sev=data.severity||0;
    const triage=forceTriage||(sev>=8?'red':sev>=5?'amber':'green');
    const token=`T-${String(Math.floor(Math.random()*800)+200)}`;
    const d={
      id:'MK-'+Date.now().toString().slice(-4),
      name:pt?.name||'Patient',age:pt?.age||30,gender:pt?.gender||'Other',
      abha:pt?.abha||'—',mode,chief:data.chief||'Not specified',
      triage,token,arrivedAt:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
      fresh:true,hospital:pt?.hospital?.name,
      vitals:{bp:'—',hr:'—',spo2:'—',temp:'—'},
      intake:data,ocr:ocrData||{drugs:[],labs:[],interactions:[]},
    };
    d.summary=buildSummary(d);
    setDraft(d);return d;
  }
  function goSummary(){const d=makeDraft(intake,ocr);setScreen('summary');return d;}
  function submitToDoctor(){
    const d=draft||makeDraft(intake,ocr);
    addToQueue(d);setSubmitted(true);
    showToast('✓ History submitted — now visible in Doctor mode','success');
    Speech.speak('Your history has been submitted to the doctor.',lang);
  }

  if(emerg)return<EmergencyScreen t={t} token={draft?.token||'T-E01'} onDismiss={()=>{setEmerg(false);setScreen('summary');}}/>;
  if(screen==='landing')return<PatientLogin lang={lang} t={t} audioOn={audioOn} showToast={showToast} onLogin={login} easy={easy} onEasyChange={onEasyChange} onToggleAudio={onToggleAudio}/>;

  const stepLbl={consent:'1/4 · Consent',mode:'2/4 · Mode',q:'3/4 · History',ocr:'4/4 · Documents',summary:'✓ Complete'}[screen]||'';

  return(
    <div className={easy?'senior-ui':''} style={{background:'var(--sl)',minHeight:'calc(100vh - 62px)'}}>
      {pt&&(
        <div style={{background:'linear-gradient(135deg,var(--n900),var(--n800))',padding:'8px 18px',display:'flex',alignItems:'center',gap:11,flexWrap:'wrap'}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:'rgba(255,255,255,.15)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:14,flexShrink:0}}>{(pt.name||'P')[0]}</div>
          <div>
            <div style={{color:'#fff',fontWeight:800,fontSize:13}}>{pt.name}</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,.5)'}}>{pt.displayId||pt.abha}</div>
          </div>
          {pt.familyAssisted&&<span style={{background:'rgba(74,222,128,.16)',color:'#B8FFD0',padding:'3px 8px',borderRadius:10,fontSize:10,fontWeight:700}}>👨‍👩‍👧 {lang==='hi'?'परिवार सहायता':'Family assisted'}</span>}
          {pt.hospital&&<span style={{background:'rgba(255,255,255,.12)',color:'rgba(255,255,255,.85)',padding:'3px 9px',borderRadius:10,fontSize:10,fontWeight:600}}>📍 {pt.hospital.name}</span>}
          <span className="abha-chip" style={{marginLeft:'auto'}}>ABHA ✓</span>
          <span style={{color:'rgba(255,255,255,.45)',fontSize:11}}>{stepLbl}</span>
        </div>
      )}
      {screen==='consent'&&(
        <div style={{maxWidth:490,margin:'0 auto',padding:'26px 16px'}} className="fu">
          <div style={{textAlign:'center',marginBottom:16}}><div style={{fontSize:42}}>🔒</div>
            <h2 style={{fontSize:18,fontWeight:900,color:'var(--n900)',marginTop:6}}>Consent & Privacy</h2></div>
          <ConsentGate t={t} lang={lang} audioOn={audioOn} onAccept={()=>setScreen('mode')}/>
        </div>
      )}
      {screen==='mode'&&<IntakeMode t={t} lang={lang} audioOn={audioOn} onSelect={m=>{setMode(m);setScreen('q');}}/>}
      {screen==='q'&&(mode==='allopathy'
        ?<SOCRATESFlow t={t} lang={lang} audioOn={audioOn} showToast={showToast} onComplete={finishIntake}/>
        :<AYUSHFlow t={t} lang={lang} audioOn={audioOn} showToast={showToast} onComplete={finishIntake}/>)}
      {screen==='ocr'&&(
        <div style={{maxWidth:560,margin:'0 auto',padding:'26px 16px'}} className="fu">
          <h2 style={{fontSize:18,fontWeight:900,color:'var(--n900)',marginBottom:3}}>{t('ocrTitle')}</h2>
          <p style={{color:'var(--t2)',fontSize:12,marginBottom:16}}>{t('ocrSub')}</p>
          <div className="card" style={{padding:18,marginBottom:11}}>
            <OCRModule lang={lang} t={t} showToast={showToast} onExtracted={setOcr}/>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button type="button" className="btn btn-gh" onClick={()=>setScreen('q')}>{t('back')}</button>
            <button type="button" className="btn btn-p" style={{flex:1}} onClick={goSummary}>{ocr?'Continue →':t('skip')}</button>
          </div>
        </div>
      )}
      {screen==='summary'&&draft&&(
        <PatientSummary draft={draft} t={t} lang={lang} audioOn={audioOn} submitted={submitted} onSubmit={submitToDoctor}/>
      )}
    </div>
  );
}

/* ══════ DOCTOR MODE — reads live queue ══════ */
function DoctorMode({lang,showToast,queue,markSeen,audioOn}){
  const t=useT(lang);
  const [selId,setSelId]=useState(queue[0]?.id);
  const [tab,setTab]=useState('summary');
  const [edits,setEdits]=useState({});
  const [notes,setNotes]=useState({});
  const [synced,setSynced]=useState({});
  const [thinking,setThinking]=useState(false);
  const speak=useSpeak(lang,audioOn);

  // Auto-select newest patient when queue grows
  const prevLen=useRef(queue.length);
  useEffect(()=>{
    if(queue.length>prevLen.current){
      const newest=queue[0];
      setSelId(newest.id);setTab('summary');
      setThinking(true);setTimeout(()=>setThinking(false),1500);
      showToast(`🔔 New patient: ${newest.name} (${newest.token})`,'success');
    }
    prevLen.current=queue.length;
    if(!queue.find(p=>p.id===selId)&&queue[0])setSelId(queue[0].id);

              </div>
              <div className="tlin">
                <div className="tldt" style={{background:'linear-gradient(135deg,#7C3AED,#A78BFA)',color:'#fff'}}>🔬</div>
                <div style={{flex:1,paddingTop:2}}>
                  <div style={{fontWeight:700,fontSize:12,marginBottom:6,color:'var(--n900)'}}>Laboratory Values</div>
                  {(sel.ocr?.labs||[]).length?sel.ocr.labs.map((l,i)=>(
                    <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--sl2)'}}>
                      <span style={{fontSize:12}}>{l.n}: <b>{l.v}</b></span>
                      <div style={{display:'flex',gap:6,alignItems:'center'}}>
                        <span style={{fontSize:10,color:'var(--t3)'}}>Ref {l.ref}</span>

              <div className="tlin">
                <div className="tldt" style={{background:'linear-gradient(135deg,var(--g800),var(--g600))',color:'#fff'}}>📜</div>
                <div style={{flex:1,paddingTop:2}}>
                  <div style={{fontWeight:700,fontSize:12,marginBottom:6,color:'var(--n900)'}}>Past History</div>
                  <span style={{fontSize:12,color:'var(--t2)'}}>{sel.intake?.pastHx&&sel.intake.pastHx!=='Not provided'?sel.intake.pastHx:'None reported'}</span>
                </div>
              </div>
            </div>
          )}

          {tab==='rx'&&(
            <div className="fu">
              <div className="card" style={{marginBottom:12}}>
                <div style={{fontWeight:800,fontSize:13,color:'var(--n900)',marginBottom:11}}>Clinical Actions</div>
                <div style={{display:'flex',flexDirection:'column',gap:9}}>
                  <button type="button" className={`btn btn-lg ${synced[sel.id]?'btn-gh':'btn-g'}`} style={{justifyContent:'flex-start',gap:10}}
                    onClick={()=>{setSynced(p=>({...p,[sel.id]:true}));showToast(t('syncDone'),'success');}}>
                    {synced[sel.id]?'✓ Synced to EHR — ABHA linked':'🔄 '+t('syncEhr')}
                  </button>
                  <button type="button" className="btn btn-o btn-lg" style={{justifyContent:'flex-start',gap:10}}
                    onClick={()=>showToast(t('labsDone'),'success')}>🔬 {t('orderLabs')}</button>
                </div>
              </div>
              <div className="card">
                <div style={{fontWeight:800,fontSize:13,color:'var(--n900)',marginBottom:10}}>{t('addNotes')}</div>
                <textarea value={noteVal} onChange={e=>setNotes(p=>({...p,[sel.id]:e.target.value}))}
                  placeholder="Differential diagnosis, prescriptions, referrals, follow-up plan…"
                  style={{width:'100%',border:'2px solid var(--sl2)',borderRadius:10,padding:12,fontSize:12,fontFamily:'inherit',resize:'vertical',minHeight:90,outline:'none',marginBottom:10,color:'var(--t1)'}}/>

              </div>
            </div>

          {tab==='fhir'&&(
            <div className="card fu">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:11,flexWrap:'wrap',gap:8}}>
                <div style={{fontWeight:800,fontSize:13,color:'var(--n900)'}}>FHIR R4 Bundle — ABDM Ready</div>
                <div style={{display:'flex',gap:5}}>

                </div>
              </div>
              <div className="fhirb">{JSON.stringify(fhir,null,2)}</div>
              <button type="button" className="btn btn-o btn-sm" style={{marginTop:10}}
                onClick={()=>{const b=new Blob([JSON.stringify(fhir,null,2)],{type:'application/json'});
                  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`FHIR_${sel.id}.json`;a.click();
                  showToast('FHIR bundle downloaded','success');}}>⬇ Download FHIR JSON</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function AdminMode({lang,queue}){
  const t=useT(lang);
  const [tab,setTab]=useState('metrics');
  const red=queue.filter(p=>p.triage==='red').length;
  const metrics=[
    {ic:'⏱',v:'2m 41s',l:t('avgTime'),s:'Target <3 min',c:'8% faster',up:true},
    {ic:'👥',v:String(3845+queue.length),l:t('vol'),s:'vs 3,512 yesterday',c:'9.5%',up:true},
    {ic:'🎤',v:'68%',l:t('voiceUse'),s:'vs 32% touch only',c:'12% voice growth',up:true},
    {ic:'🚨',v:String(11+red),l:'Red Flag Alerts',s:'Emergency triage today',c:'4 admitted',up:false},
  ];
  const kiosks=[{id:'K-01',loc:'OPD Block A',s:'on',n:142},{id:'K-02',loc:'OPD Block B',s:'on',n:98},
    {id:'K-03',loc:'AYUSH OPD',s:'on',n:67},{id:'K-04',loc:'Emergency Lobby',s:'warn',n:31},{id:'K-05',loc:'Paediatrics',s:'off',n:0}];
  const langs=[{l:'Hindi',p:42,c:'var(--n700)'},{l:'English',p:31,c:'var(--g800)'},{l:'Bengali',p:12,c:'#7C3AED'},{l:'Tamil',p:8,c:'var(--amb)'},{l:'Others',p:7,c:'var(--sl4)'}];
  const logs=[
    ...queue.filter(p=>p.fresh).map(p=>({t:p.arrivedAt,e:`New intake ${p.id} — ${p.name} (${p.triage.toUpperCase()} triage)`,ty:p.triage==='red'?'alert':'success'})),
    {t:'14:32:11',e:'MK-001 — Emergency triage triggered by SOCRATES engine',ty:'alert'},
    {t:'14:28:44',e:'OCR scan complete on K-02 in 4.2s (Tesseract eng)',ty:'info'},
    {t:'14:25:19',e:'FHIR R4 Bundle pushed to ABDM sandbox — MK-002',ty:'success'},
    {t:'14:20:05',e:'Session auto-wiped MK-003 after 30-min TTL',ty:'info'},
    {t:'14:15:33',e:'Drug interaction flagged — Aspirin + Warfarin',ty:'alert'},
    {t:'14:10:22',e:'ASR benchmark: WER 9.8% en-IN, 11.2% hi-IN',ty:'info'},
    {t:'14:05:44',e:'Kiosk K-05 offline — maintenance mode',ty:'error'},
  ];
  return(
    <div style={{padding:18,maxWidth:1060,margin:'0 auto'}}>
      <div style={{display:'flex',gap:3,marginBottom:18,background:'#fff',borderRadius:12,padding:3,boxShadow:'0 2px 8px rgba(11,29,58,.06)',border:'1px solid var(--sl2)',maxWidth:430}}>
        {[['metrics','📊 '+t('opdMetrics')],['hw','🖥 '+t('hw')],['comp','🔒 '+t('compliance')]].map(([id,lb])=>(
          <button key={id} type="button" onClick={()=>setTab(id)}
            style={{flex:1,padding:'9px 5px',borderRadius:9,border:'none',cursor:'pointer',fontSize:12,fontWeight:700,
              background:tab===id?'linear-gradient(135deg,var(--n800),var(--n700))':'transparent',color:tab===id?'#fff':'var(--t2)'}}>{lb}</button>
        ))}
      </div>
      {tab==='metrics'&&(
        <div className="fu">
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(185px,1fr))',gap:13,marginBottom:18}}>
            {metrics.map((m,i)=>(
              <div key={i} style={{background:'#fff',borderRadius:16,padding:18,boxShadow:'0 2px 8px rgba(11,29,58,.06)',border:'1px solid var(--sl2)',position:'relative',overflow:'hidden'}}>
                <div style={{position:'absolute',top:0,left:0,right:0,height:3,background:'linear-gradient(90deg,var(--n800),var(--g700))'}}/>
                <div style={{fontSize:24,marginBottom:6}}>{m.ic}</div>
                <div className="mbig" style={{color:'var(--n900)',fontSize:27}}>{m.v}</div>
                <div style={{fontSize:12,color:'var(--t2)',marginTop:3,fontWeight:600}}>{m.l}</div>
                <div style={{fontSize:10,color:'var(--t3)',marginTop:2}}>{m.s}</div>
                <div style={{fontSize:11,fontWeight:700,marginTop:7,color:m.up?'var(--g800)':'var(--r)'}}>{m.up?'↑':'↓'} {m.c}</div>
              </div>
            ))}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div className="card">
              <div style={{fontWeight:800,fontSize:13,color:'var(--n900)',marginBottom:13}}>📊 Hourly Patient Volume</div>
              {['8AM','9AM','10AM','11AM','12PM','1PM','2PM'].map((h,i)=>{
                const v=[45,128,210,187,156,98,67][i],p=Math.round(v/210*100);

                  <span style={{fontSize:10,color:'var(--t3)',width:30,fontWeight:600}}>{h}</span>
                  <div style={{flex:1,height:9,background:'var(--sl2)',borderRadius:5,overflow:'hidden'}}>
                    <div style={{height:'100%',width:p+'%',background:'linear-gradient(90deg,var(--n700),var(--n500))',borderRadius:5,transition:'width .8s'}}/></div>
                  <span style={{fontSize:11,fontWeight:700,width:26,textAlign:'right',color:'var(--n800)'}}>{v}</span>
                </div>;})}
            </div>
            <div className="card">
              <div style={{fontWeight:800,fontSize:13,color:'var(--n900)',marginBottom:13}}>🌐 Language Distribution</div>
              {langs.map((l,i)=>(

                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                    <span style={{fontSize:12,fontWeight:600}}>{l.l}</span>
                    <span style={{fontSize:12,fontWeight:900,color:l.c}}>{l.p}%</span></div>

      {tab==='hw'&&(
        <div className="fu" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <div className="card">
            <div style={{fontWeight:800,fontSize:13,color:'var(--n900)',marginBottom:13}}>🖥 Kiosk Terminals</div>
            {kiosks.map(k=>(
              <div key={k.id} className="krow">
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <div className={`pdot ${k.s}`}/>
                  <div><div style={{fontWeight:700,fontSize:12,color:'var(--n900)'}}>{k.id} — {k.loc}</div>
                    <div style={{fontSize:10,color:'var(--t3)'}}>{k.n} sessions today</div></div>
                </div>
                <span style={{fontSize:10,fontWeight:800,textTransform:'uppercase',color:k.s==='on'?'var(--g800)':k.s==='warn'?'var(--amb)':'var(--r)'}}>
                  {k.s==='on'?'Online':k.s==='warn'?'Warning':'Offline'}</span>
              </div>
            ))}
          </div>
          <div className="card">
            <div style={{fontWeight:800,fontSize:13,color:'var(--n900)',marginBottom:13}}>⚡ Inference Server Health</div>
            {[{n:'GPU Load (A100)',v:67,u:'%',hi:85,c:'var(--n700)'},{n:'ASR Whisper latency',v:340,u:'ms',hi:500,c:'var(--g800)'},
              {n:'OCR pipeline',v:4.2,u:'s',hi:8,c:'#7C3AED'},{n:'LLM summary gen',v:1.8,u:'s',hi:5,c:'var(--amb)'}].map((s,i)=>(
              <div key={i} style={{marginBottom:12}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:12,fontWeight:600}}>{s.n}</span>
                  <span style={{fontSize:12,fontWeight:900,color:s.v>s.hi*.8?'var(--amb)':'var(--g800)'}}>{s.v}{s.u}</span></div>
                <div className="pgb" style={{height:9}}><div style={{height:'100%',width:Math.min(s.v/s.hi*100,100)+'%',background:s.v>s.hi*.8?'var(--amb)':s.c,borderRadius:5,transition:'width .8s'}}/></div>
              </div>
            ))}
            <div style={{marginTop:10,background:'linear-gradient(135deg,#F0FDF4,#ECFDF5)',borderRadius:10,padding:12,border:'1px solid rgba(21,128,61,.15)'}}>
              <div style={{fontSize:9,fontWeight:800,color:'var(--g800)',textTransform:'uppercase',marginBottom:5}}>✓ ASR Word Error Rate</div>
              <div style={{display:'flex',gap:14}}>
                <div><div style={{fontSize:19,fontWeight:900,color:'var(--g800)'}}>9.8%</div><div style={{fontSize:9,color:'var(--t3)'}}>en-IN</div></div>
                <div><div style={{fontSize:19,fontWeight:900,color:'var(--g800)'}}>11.2%</div><div style={{fontSize:9,color:'var(--t3)'}}>hi-IN</div></div>
              </div>
              <div style={{fontSize:9,color:'var(--t3)',marginTop:3}}>Target &lt;12% WER ✓</div>
            </div>
          </div>
        </div>
      )}
      {tab==='comp'&&(
        <div className="fu">
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(185px,1fr))',gap:12,marginBottom:16}}>
            {[{ic:'📜',ti:'DPDP Act 2023',st:'Compliant'},{ic:'🔗',ti:'ABDM / FHIR R4',st:'Active'},
              {ic:'🔒',ti:'Aadhaar Masking',st:'Enforced'},{ic:'🗑',ti:'Session Auto-Wipe',st:'30 min TTL'}].map((c,i)=>(
              <div key={i} style={{background:'#fff',borderRadius:14,padding:16,boxShadow:'0 2px 8px rgba(11,29,58,.06)',border:'1px solid var(--sl2)',borderTop:'3px solid var(--g700)'}}>
                <div style={{fontSize:24,marginBottom:6}}>{c.ic}</div>
                <div style={{fontWeight:800,fontSize:12,color:'var(--n900)',marginBottom:5}}>{c.ti}</div>
                <span className="bdg bdg-g">{c.st}</span>
              </div>
            ))}
          </div>
          <div className="card">
            <div style={{fontWeight:800,fontSize:13,color:'var(--n900)',marginBottom:11}}>📋 Live Security Audit Log</div>
            {logs.map((l,i)=>(
              <div key={i} className="logr">
                <code className="logt">{l.t}</code>
                <span style={{fontSize:11,lineHeight:1.5,color:l.ty==='alert'?'var(--amb)':l.ty==='error'?'var(--r)':l.ty==='success'?'var(--g800)':'var(--t1)'}}>
                  {l.ty==='alert'?'⚠ ':l.ty==='error'?'✕ ':l.ty==='success'?'✓ ':'ℹ '}{l.e}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
